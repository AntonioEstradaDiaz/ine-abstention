name: PULSO readiness monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulso-readiness-monitor
  cancel-in-progress: false

jobs:
  readiness:
    name: Remote readiness and alerting
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Readiness check (requires configured vars and secrets)
        env:
          PULSO_HEALTH_URL: ${{ vars.PULSO_HEALTH_URL }}
          PULSO_INTERNAL_API_TOKEN: ${{ secrets.PULSO_MONITOR_INTERNAL_TOKEN }}
          PULSO_ALERT_WEBHOOK: ${{ secrets.PULSO_ALERT_WEBHOOK }}
        run: python3 scripts/ops_healthcheck.py
