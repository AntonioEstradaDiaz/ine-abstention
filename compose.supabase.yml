name: ine-abstention-supabase
services:
  migrate:
    build: .
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set the migration URL in .env}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-ine}
    command: [alembic, upgrade, head]
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the runtime URL in .env}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-ine}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    ports:
      - "127.0.0.1:${API_PORT:-8002}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
