[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ine-abstention-backend"
version = "0.1.0"
description = "Backend de análisis territorial de abstención electoral"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.161.0,<0.162",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "geoalchemy2>=0.16,<1",
  "alembic>=1.14,<2",
  "polars>=1.30,<2",
  "starlette>=1.9.0,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
ml = [
  "numpy>=2,<3",
  "scikit-learn>=1.6,<2",
  "xgboost>=3,<4",
  "lightgbm>=4.6,<5",
  "joblib>=1.4,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requiere PostgreSQL con PostGIS"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
